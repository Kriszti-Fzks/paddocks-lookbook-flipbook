<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Paddocks Lookbook</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
        }
        /* Style the book container */
        #flipbook {
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            background: #fff;
            border-radius: 0;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }
        /* Style individual pages */
        .page {
            padding: 0;
            margin: 0;
            background-color: transparent;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            margin: 0;
            padding: 0;
        }
        /* Controls */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        button {
            padding: 12px 24px;
            background-color: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
        }
        .page-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #666;
            font-size: 14px;
            background: rgba(255,255,255,0.9);
            padding: 8px 16px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Flipbook container -->
        <div id="flipbook"></div>

        <!-- Page counter -->
        <div class="page-counter">
            <span id="current-page">1</span> / <span id="total-pages">11</span>
        </div>
    </div>

    <!-- Navigation Controls -->
    <div class="controls">
        <button id="prev-btn" onclick="flipPrev()">← Previous</button>
        <button id="next-btn" onclick="flipNext()">Next →</button>
    </div>

    <script>
        let currentPage = 0;
        const pages = [
            "The_Paddocks_Lookbook_Page_01.jpg",
            "The_Paddocks_Lookbook_Page_02.jpg",
            "The_Paddocks_Lookbook_Page_03.jpg",
            "The_Paddocks_Lookbook_Page_04.jpg",
            "The_Paddocks_Lookbook_Page_05.jpg",
            "The_Paddocks_Lookbook_Page_06.jpg",
            "The_Paddocks_Lookbook_Page_07.jpg",
            "The_Paddocks_Lookbook_Page_08.jpg",
            "The_Paddocks_Lookbook_Page_09.jpg",
            "The_Paddocks_Lookbook_Page_10.jpg",
            "The_Paddocks_Lookbook_Page_11.jpg"
        ];

        function showPage(index) {
            if (index < 0 || index >= pages.length) return;
            currentPage = index;

            const flipbook = document.getElementById("flipbook");
            flipbook.innerHTML = `<div class="page"><img src="${pages[currentPage]}" alt="Page ${currentPage + 1}"></div>`;

            document.getElementById("current-page").textContent = currentPage + 1;
            document.getElementById("prev-btn").disabled = currentPage === 0;
            document.getElementById("next-btn").disabled = currentPage === pages.length - 1;
        }

        function flipNext() {
            if (currentPage < pages.length - 1) {
                showPage(currentPage + 1);
            }
        }

        function flipPrev() {
            if (currentPage > 0) {
                showPage(currentPage - 1);
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            showPage(0);

            // Keyboard navigation
            document.addEventListener("keydown", function(e) {
                if (e.key === "ArrowRight") flipNext();
                if (e.key === "ArrowLeft") flipPrev();
            });
        });
    </script>

</body>
</html>
