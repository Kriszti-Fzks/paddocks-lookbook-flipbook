<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Paddocks Lookbook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
            overflow: auto;
        }
        .container {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            gap: 40px;
            padding: 60px 80px;
        }
        #flipbook {
            width: 90%;
            max-width: 1000px;
            aspect-ratio: 11 / 8.5;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border-radius: 0;
            margin-top: 60px;
            margin-bottom: 60px;
        }
        .page {
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .page.active {
            display: flex;
        }
        .page img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .page video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
            width: 100%;
            pointer-events: none;
            justify-content: center;
            padding: 0 20px;
        }
        .button-wrapper {
            display: flex;
            justify-content: space-between;
            pointer-events: auto;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            gap: 200px;
        }
        button {
            padding: 16px 24px;
            font-size: 18px;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            border: 2px solid white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        button:hover:not(:disabled) {
            background-color: rgba(0, 0, 0, 0.95);
            transform: scale(1.1);
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .page-counter {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="flipbook">
            <div class="page active"><img src="The_Paddocks_Lookbook_Page_01.jpg" alt="Page 1"></div>
            <div class="page"><video controls style="width: 100%; height: 100%;"><source src="promo.mp4" type="video/mp4">Your browser does not support the video tag.</video></div>
            <div class="page"><img src="The_Paddocks_Lookbook_Page_02.jpg" alt="Page 2"></div>
            <div class="page"><img src="The_Paddocks_Lookbook_Page_03.jpg" alt="Page 3"></div>
            <div class="page"><img src="The_Paddocks_Lookbook_Page_04.jpg" alt="Page 4"></div>
            <div class="page"><img src="The_Paddocks_Lookbook_Page_05.jpg" alt="Page 5"></div>
            <div class="page"><img src="The_Paddocks_Lookbook_Page_06.jpg" alt="Page 6"></div>
            <div class="page"><img src="The_Paddocks_Lookbook_Page_07.jpg" alt="Page 7"></div>
            <div class="page"><img src="The_Paddocks_Lookbook_Page_08.jpg" alt="Page 8"></div>
            <div class="page"><img src="The_Paddocks_Lookbook_Page_09.jpg" alt="Page 9"></div>
            <div class="page"><img src="The_Paddocks_Lookbook_Page_10.jpg" alt="Page 10"></div>
            <div class="page"><img src="The_Paddocks_Lookbook_Page_11.jpg" alt="Page 11"></div>
        </div>
    </div>

    <div class="page-counter">
        <span id="current">1</span> / 12
    </div>

    <div class="controls">
        <div class="button-wrapper">
            <button id="prev" onclick="prevPage()">← Previous</button>
            <button id="next" onclick="nextPage()">Next →</button>
        </div>
    </div>

    <script>
        let currentPage = 0;
        const pages = document.querySelectorAll('.page');
        const totalPages = pages.length;

        function showPage(index) {
            pages.forEach(p => p.classList.remove('active'));
            pages[index].classList.add('active');
            document.getElementById('current').textContent = index + 1;
            document.getElementById('prev').disabled = index === 0;
            document.getElementById('next').disabled = index === totalPages - 1;
            currentPage = index;
        }

        function nextPage() {
            if (currentPage < totalPages - 1) showPage(currentPage + 1);
        }

        function prevPage() {
            if (currentPage > 0) showPage(currentPage - 1);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextPage();
            if (e.key === 'ArrowLeft') prevPage();
        });

        showPage(0);
    </script>
</body>
</html>
